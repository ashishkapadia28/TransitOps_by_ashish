worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       "C:/Users/admin/AppData/Local/Microsoft/WinGet/Packages/nginxinc.nginx_Microsoft.Winget.Source_8wekyb3d8bbwe/nginx-1.31.2/conf/mime.types";
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream transitops_app {
        server 127.0.0.1:8010;
    }

    server {
        listen       8090;
        server_name  _;

        client_max_body_size 20M;

        location /static/ {
            alias C:/Users/admin/Downloads/TransitOps_by_ashish-main/TransitOps_by_ashish-main/backend/staticfiles/;
        }

        location / {
            proxy_pass http://transitops_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
